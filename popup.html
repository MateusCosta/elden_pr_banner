<!DOCTYPE html>
<meta charset="UTF-8">
<html>
<head>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>ELDEN PR</h1>

  <div class="setting">
    <label for="soundToggle">Enable sound</label>
    <label class="switch">
      <input type="checkbox" id="soundToggle">
      <span class="slider"></span>
    </label>
  </div>


  <div class="setting">
    <span>Choose banner color:</span>
    <div id="colorChoices">
      <div class="color-option" data-color="yellow" style="background-color: gold;"></div>
      <div class="color-option" data-color="red" style="background-color: red;"></div>
      <div class="color-option" data-color="blue" style="background-color: blue;"></div>
    </div>
  </div>
  
  <div class="setting">
    <span class="support">
      Thanks to the original
      <a href="https://github.com/MettiFire/elden_mail_banner" target="_blank" rel="noopener noreferrer">Elden Email</a>
      project
    </span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
